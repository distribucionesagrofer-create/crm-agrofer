version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - crm-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    shm_size: '1gb'
    environment:
      TZ: America/Bogota
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ${SESSIONS_DIR:-./sessions}:/app/sessions
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
    depends_on:
      - mongodb
      - redis
    networks:
      - crm-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - crm-network
    restart: unless-stopped

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-drako2024}
      MONGO_INITDB_DATABASE: drakocrm
    volumes:
      - mongo-data:/data/db
    networks:
      - crm-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-drako2024}
    volumes:
      - redis-data:/data
    networks:
      - crm-network
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:

networks:
  crm-network:
    driver: bridge
