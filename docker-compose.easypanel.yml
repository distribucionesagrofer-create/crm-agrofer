services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - crm-network
      - easypanel
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    shm_size: '1gb'
    environment:
      TZ: America/Bogota
      PORT: 3000
      NODE_ENV: production
      MONGO_URI: mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/drakocrm?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FRONTEND_URL: ${PUBLIC_URL}
      PUBLIC_URL: ${PUBLIC_URL}
      SP_API_KEY: ${SP_API_KEY}
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW: 60
    volumes:
      - ${SESSIONS_DIR:-./sessions}:/app/sessions
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
    depends_on:
      - mongodb
      - redis
    networks:
      - crm-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - crm-network
    restart: unless-stopped

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: drakocrm
    volumes:
      - mongo-data:/data/db
    networks:
      - crm-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - crm-network
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:

networks:
  crm-network:
    driver: bridge
  easypanel:
    external: true
