events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # Resolver interno de Docker — re-resuelve cada 10s para que rebuilds no rompan el proxy
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # Frontend
    location / {
      set $frontend_upstream http://frontend:80;
      proxy_pass $frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Salud del backend
    location /health {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Media files
    location /media/ {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_buffering off;
      add_header Access-Control-Allow-Origin "*";
      add_header Cache-Control "public, max-age=604800";
    }

    # API
    location /api/ {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      # Conectar una línea de WhatsApp desde cero (screencast/iniciar, supervisar) puede
      # tardar hasta 90s arrancando Chromium — el default de 60s cortaba la petición a
      # mitad de camino.
      proxy_read_timeout 150s;
      proxy_send_timeout 150s;
    }

    # Webhook de Meta (WhatsApp Cloud API)
    location /webhook/ {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    location /socket.io/ {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
